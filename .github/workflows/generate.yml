name: Generate V4 report revision

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd); blank uses Shanghai today
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "data/**"
      - "collected/**"
      - "generated/**"

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate immutable revision
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          REPORT_DATE="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- validate --root .
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- generate --root . --date "$REPORT_DATE" --source-commit "$GITHUB_SHA"
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- build-pages --root . --date "$REPORT_DATE"
      - name: Persist revision and dashboard
        run: |
          git config user.name "qimiao-automation[bot]"
          git config user.email "qimiao-automation[bot]@users.noreply.github.com"
          git add reports/ web/data/
          git diff --cached --quiet || git commit -m "chore(v4): generate report revision"
          git push

