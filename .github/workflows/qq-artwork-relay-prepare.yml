name: Prepare selected artwork Pages relay

on:
  workflow_dispatch:
    inputs:
      reportDate:
        description: Locked report date (yyyy-MM-dd)
        required: true
        type: string
      revision:
        description: Exact locked revision
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qimiao-v4-artwork-relay
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qq-test/package-lock.json
      - name: Install image relay utilities
        run: npm ci --ignore-scripts
        working-directory: tools/qq-test
      - name: Download the locked selected artwork and create a Pages relay
        env:
          INPUT_REPORT_DATE: ${{ inputs.reportDate }}
          INPUT_REVISION: ${{ inputs.revision }}
          ARTWORK_RELAY_PAGES_BASE_URL: https://tooltingsu.github.io/qimiao-daily
        run: node tools/qq-test/artwork-relay.mjs
      - name: Commit temporary public relay files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/artwork-relay
          if ! git diff --cached --quiet; then
            git commit -m "chore(artwork): prepare Pages relay ${{ inputs.reportDate }} r${{ inputs.revision }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # A commit made with GITHUB_TOKEN does not start another push workflow.
      # Deploy here so that the next QQ test can retrieve the exact relay URL.
      - name: Scan the Pages relay before deployment
        run: python3 tools/v4/secret_scan.py --tree web --output $RUNNER_TEMP/pages-secret-scan.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy the temporary artwork relay to Pages
        id: deployment
        uses: actions/deploy-pages@v5
