name: QQ forum test post verification

on:
  workflow_dispatch:
    inputs:
      titlePrefix:
        description: Exact test-title prefix to verify; blank verifies all V4-C test posts
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-forum-post:
    runs-on: ubuntu-latest
    environment: qq-test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qq-test/package-lock.json
      - name: Install Tencent official SDK
        run: npm ci --ignore-scripts
        working-directory: tools/qq-test
      - name: Verify forum test post through the read-only API
        env:
          QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_BOT_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
          QQ_TEST_TARGET_TYPE: ${{ vars.QQ_TEST_TARGET_TYPE }}
          QQ_TEST_CHANNEL_ID: ${{ vars.QQ_TEST_CHANNEL_ID }}
          QQ_TEST_TITLE_PREFIX: ${{ inputs.titlePrefix }}
          FORUM_VERIFY_OUTPUT: ${{ runner.temp }}/qq-forum-verify.md
          FORUM_VERIFY_JSON_OUTPUT: ${{ runner.temp }}/qq-forum-verify.json
        run: node tools/qq-test/verify-forum.mjs
      - uses: actions/setup-dotnet@v5
        if: success() && inputs.titlePrefix != ''
        with:
          dotnet-version: 8.0.x
      - name: Persist only the sanitized visible state for the exact test post
        if: success() && inputs.titlePrefix != ''
        env:
          INPUT_TITLE_PREFIX: ${{ inputs.titlePrefix }}
          FORUM_VERIFY_JSON: ${{ runner.temp }}/qq-forum-verify.json
        run: |
          # The V4-C test titles always end in yyyy-MM-dd. Do not accept a
          # broad verifier result for write-back.
          export INPUT_REPORT_DATE="$(echo "${INPUT_TITLE_PREFIX}" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$')"
          test -n "${INPUT_REPORT_DATE}"
          dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
          python3 tools/v4/qq_test_verify_writeback.py
      - name: Publish safe verification summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/qq-forum-verify.md" ]; then
            cat "${RUNNER_TEMP}/qq-forum-verify.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# QQ 论坛测试帖核验失败" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成可安全展示的核验结果。" >> "$GITHUB_STEP_SUMMARY"
          fi
