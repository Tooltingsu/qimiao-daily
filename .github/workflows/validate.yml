name: Validate V4 data and portable code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/QimiaoDaily.V4/QimiaoDaily.V4.csproj
      - run: dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --no-restore
      - run: dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- validate --root .
      - run: dotnet test tests/QimiaoDaily.Core.Tests/QimiaoDaily.Core.Tests.csproj -c Release
      - run: dotnet test tests/QimiaoDaily.Collectors.Tests/QimiaoDaily.Collectors.Tests.csproj -c Release
      - run: dotnet test tests/QimiaoDaily.V4.Tests/QimiaoDaily.V4.Tests.csproj -c Release
