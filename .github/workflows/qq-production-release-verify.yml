name: QQ production release visibility verification

on:
  workflow_dispatch:
    inputs:
      reportDate:
        description: Production report date (yyyy-MM-dd)
        required: true
        type: string
      revision:
        description: Submitted revision to verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qimiao-v4-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qq-test/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts
        working-directory: tools/qq-test
      - name: Read back the exact production forum thread
        env:
          INPUT_REPORT_DATE: ${{ inputs.reportDate }}
          QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_BOT_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
          QQ_TARGET_TYPE: ${{ vars.QQ_PROD_TARGET_TYPE }}
          QQ_TARGET_CHANNEL_ID: ${{ vars.QQ_PROD_CHANNEL_ID }}
          FORUM_VERIFY_OUTPUT: ${{ runner.temp }}/qq-production-verify.md
          FORUM_VERIFY_JSON_OUTPUT: ${{ runner.temp }}/qq-production-verify.json
        run: |
          export QQ_TEST_TITLE_PREFIX="绮喵日报 ${INPUT_REPORT_DATE//-/}"
          node tools/qq-test/verify-forum.mjs
      - name: Promote only a visible post to PUBLISHED
        env:
          INPUT_REPORT_DATE: ${{ inputs.reportDate }}
          INPUT_REVISION: ${{ inputs.revision }}
          FORUM_VERIFY_JSON: ${{ runner.temp }}/qq-production-verify.json
        run: |
          python3 tools/v4/qq_production_verify_writeback.py
          dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- build-pages --root . --date '${{ inputs.reportDate }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish-log web/data
          git commit -m "chore(release): verify ${{ inputs.reportDate }} r${{ inputs.revision }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish sanitized verification summary
        if: always()
        run: cat "${RUNNER_TEMP}/qq-production-verify.md" >> "$GITHUB_STEP_SUMMARY"
