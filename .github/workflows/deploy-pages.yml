name: Deploy V4 static control center

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: ["Generate V4 report revision", "Republish V4 corrected revision (DRY RUN)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Scan actual Pages artifact before upload
        run: python3 tools/v4/secret_scan.py --tree web --output $RUNNER_TEMP/pages-secret-scan.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
