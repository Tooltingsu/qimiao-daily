name: Publish V4 report watchdog (DRY RUN)

on:
  schedule:
    - cron: "25,30,35,40,45,50 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd); blank uses Shanghai today
        required: false
        type: string
      simulate_deadline:
        description: Test auto-lock outside the actual watchdog window
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  dry-run-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qq-publish-dry-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
      - name: Lock current valid revision and exercise the QQ-free publish path
        env:
          INPUT_DATE: ${{ inputs.date }}
          SIMULATE_DEADLINE: ${{ inputs.simulate_deadline }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/v4/runtime.py publish
