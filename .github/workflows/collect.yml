name: Collect V4 automatic sources

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- collect-bgi --root .
      - name: Persist metadata only
        run: |
          git config user.name "qimiao-automation[bot]"
          git config user.email "qimiao-automation[bot]@users.noreply.github.com"
          git add collected/
          git diff --cached --quiet || git commit -m "chore(v4): refresh collected metadata"
          git push

