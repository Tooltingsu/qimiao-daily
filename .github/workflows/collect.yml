name: Collect V4 automatic sources

on:
  schedule:
    # 19:05 Asia/Shanghai. GitHub schedules are best-effort, so the report
    # generator is triggered by this workflow's trusted-main writeback.
    - cron: "5 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd); blank uses Shanghai today
        required: false
        type: string
      replace_artwork_candidates:
        description: Replace unqueued artwork candidates with this collection result
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/qq-test/package-lock.json
      - run: dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
      - name: Collect BGI, official videos and Pixiv metadata
        env:
          INPUT_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
          PIXIV_SESSION: ${{ secrets.PIXIV_SESSION }}
          INPUT_REPLACE_ARTWORK_CANDIDATES: ${{ inputs.replace_artwork_candidates }}
          # Optional. Browser-like headers are always used; this session is
          # only a fallback if Bilibili applies stronger cloud-IP risk control.
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/v4/runtime.py collect
      - name: Install safe thumbnail relay utilities
        run: npm ci --ignore-scripts
        working-directory: tools/qq-test
      - name: Build bounded same-origin Pixiv thumbnail previews
        env:
          INPUT_ARTWORK_PREVIEW_LIMIT: "30"
        run: node tools/qq-test/artwork-preview-relay.mjs
      - name: Commit temporary review previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/artwork-preview web/data/artwork-preview.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(artwork): refresh Pages review thumbnails"
            # The collector's guarded writeback has already pushed its own
            # commit. Push this relay child directly; a concurrent remote
            # update fails safely rather than overwriting it.
            git push origin HEAD:main
          fi
      - name: Generate the post-collection report and Pages projection
        env:
          INPUT_DATE: ${{ inputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/v4/runtime.py generate
