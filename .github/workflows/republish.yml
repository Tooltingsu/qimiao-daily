name: Republish V4 corrected revision (DRY RUN)

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd)
        required: true
        type: string
      reason:
        description: Why a corrected full report is being republished
        required: true
        type: string
      force:
        description: Explicitly bypass normal same-day idempotency
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  republish-dry-run:
    if: github.ref == 'refs/heads/main' && inputs.force == true
    runs-on: ubuntu-latest
    environment: qq-publish-dry-run
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
      - name: Generate, lock and record corrected dry-run revision
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_FORCE: ${{ inputs.force }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/v4/runtime.py republish
