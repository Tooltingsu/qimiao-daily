name: Calculate V4 calendar and endgame

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd); blank uses Shanghai today
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "data/**"

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  calculate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate and calculate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          REPORT_DATE="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- validate --root .
          dotnet run --project src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -- calculate --root . --date "$REPORT_DATE"
      - name: Persist calculated data
        run: |
          git config user.name "qimiao-automation[bot]"
          git config user.email "qimiao-automation[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "chore(v4): calculate calendar and endgame"
          git push

