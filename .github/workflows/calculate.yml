name: Calculate V4 calendar and endgame

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Report date (yyyy-MM-dd); blank uses Shanghai today
        required: false
        type: string
  push:
    branches: [main]
    paths: ["data/**"]

permissions:
  contents: write

concurrency:
  group: qimiao-v4-repository-writer
  cancel-in-progress: false

jobs:
  calculate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/QimiaoDaily.V4/QimiaoDaily.V4.csproj -c Release --nologo
      - name: Validate manual data and calculate derived data
        env:
          INPUT_DATE: ${{ inputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/v4/runtime.py calculate
